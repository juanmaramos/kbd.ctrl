name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Build, sign, and notarize
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up universal Rust targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --all-targets \
            --locked \
            -- \
            -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Validate release credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_BASE64 \
            KEYCHAIN_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required release secret: ${name}"
              exit 1
            fi
          done

      - name: Match tag to app version
        run: |
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${app_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v${app_version}"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/kbd-ctrl-signing.keychain-db"

          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -k "${keychain_path}" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "${keychain_path}" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${keychain_path}"

          signing_identity="$(
            security find-identity -v -p codesigning "${keychain_path}" |
              sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' |
              head -n 1
          )"
          if [[ -z "${signing_identity}" ]]; then
            echo "::error::No Developer ID Application identity was imported"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=${signing_identity}" >> "${GITHUB_ENV}"
          echo "KBD_RELEASE_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 --decode > "${api_key_path}"
          chmod 600 "${api_key_path}"
          echo "APPLE_API_KEY_PATH=${api_key_path}" >> "${GITHUB_ENV}"

      - name: Build, sign, and notarize universal app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri -- build --ci --bundles app,dmg --target universal-apple-darwin

      - name: Notarize and staple universal DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          dmg_path="$(find "${bundle_root}/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"

          if [[ -z "${dmg_path}" ]]; then
            echo "::error::Expected DMG was not produced"
            exit 1
          fi

          xcrun notarytool submit "${dmg_path}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${dmg_path}"

      - name: Verify release artifact
        id: artifact
        run: |
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path="${bundle_root}/macos/kbd.ctrl.app"
          dmg_path="$(find "${bundle_root}/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"

          if [[ ! -d "${app_path}" || -z "${dmg_path}" ]]; then
            echo "::error::Expected app or DMG was not produced"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=2 "${app_path}"
          xcrun stapler validate "${app_path}"
          xcrun stapler validate "${dmg_path}"

          dmg_filename="$(basename "${dmg_path}")"
          dmg_sha256="$(shasum -a 256 "${dmg_path}" | awk '{print $1}')"
          printf '%s  %s\n' \
            "${dmg_sha256}" \
            "${dmg_filename}" > "${dmg_path}.sha256"
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cask_path="${bundle_root}/dmg/kbd-ctrl.rb"
          ../../scripts/render-homebrew-cask.sh \
            "${app_version}" \
            "${dmg_sha256}" \
            "${cask_path}"
          ruby -c "${cask_path}"

          {
            echo "dmg_path=${dmg_path}"
            echo "checksum_path=${dmg_path}.sha256"
            echo "cask_path=${cask_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${KBD_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "${KBD_RELEASE_KEYCHAIN}" || true
          fi
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "${APPLE_API_KEY_PATH}"
          fi
          rm -f "${RUNNER_TEMP}/developer-id.p12"

      - name: Upload verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kbd-ctrl-${{ github.sha }}
          path: |
            apps/desktop/${{ steps.artifact.outputs.dmg_path }}
            apps/desktop/${{ steps.artifact.outputs.checksum_path }}
            apps/desktop/${{ steps.artifact.outputs.cask_path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kbd-ctrl-${{ github.sha }}
          path: release-payload

      - name: Verify downloaded payload
        id: artifact
        shell: bash
        run: |
          mapfile -t dmg_files < <(find release-payload -type f -name '*.dmg' -print)
          mapfile -t checksum_files < <(find release-payload -type f -name '*.dmg.sha256' -print)
          mapfile -t cask_files < <(find release-payload -type f -name 'kbd-ctrl.rb' -print)

          if [[ "${#dmg_files[@]}" -ne 1 ||
                "${#checksum_files[@]}" -ne 1 ||
                "${#cask_files[@]}" -ne 1 ]]; then
            echo "::error::Expected one DMG, checksum, and Homebrew cask"
            exit 1
          fi

          dmg_path="${dmg_files[0]}"
          checksum_path="${checksum_files[0]}"
          cask_path="${cask_files[0]}"

          read -r expected_sha256 expected_name < "${checksum_path}"
          if [[ "${expected_name}" != "$(basename "${dmg_path}")" ]]; then
            echo "::error::Checksum filename does not match the DMG"
            exit 1
          fi
          actual_sha256="$(sha256sum "${dmg_path}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${expected_sha256}" ]]; then
            echo "::error::Downloaded DMG checksum does not match"
            exit 1
          fi
          ruby -c "${cask_path}"

          {
            echo "dmg_path=${dmg_path}"
            echo "checksum_path=${checksum_path}"
            echo "cask_path=${cask_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PATH: ${{ steps.artifact.outputs.dmg_path }}
          CHECKSUM_PATH: ${{ steps.artifact.outputs.checksum_path }}
          CASK_PATH: ${{ steps.artifact.outputs.cask_path }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${DMG_PATH}" \
            "${CHECKSUM_PATH}" \
            "${CASK_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "kbd.ctrl ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
