[package]
name = "kbd-ctrl"
version = "0.1.1"
description = "Open configuration and control software for programmable HID keypads"
authors = ["Juanma Ramos"]
license = "MIT"
repository = "https://github.com/juanmaramos/kbd.ctrl"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kbd_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
hidapi = "2.6.6"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2.0"
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3.2", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL"] }
